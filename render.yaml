services:
  - type: web
    name: cloudquiz-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run prisma:generate && npm run build:backend
    startCommand: npm run prisma:migrate:deploy && npm run start:backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
