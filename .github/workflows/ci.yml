name: CloudQuiz CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test-and-build:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cloudquiz
          POSTGRES_PASSWORD: cloudquiz_test_secret
          POSTGRES_DB: cloudquiz_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate --schema=apps/backend/prisma/schema.prisma

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run linting
        run: npm run lint

      - name: Validate TypeScript (Typecheck)
        run: npm run typecheck

      - name: Run database migrations against test database
        env:
          DATABASE_URL: postgresql://cloudquiz:cloudquiz_test_secret@localhost:5434/cloudquiz_test?schema=public
        run: npx prisma migrate deploy --schema=apps/backend/prisma/schema.prisma

      - name: Execute backend tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://cloudquiz:cloudquiz_test_secret@localhost:5434/cloudquiz_test?schema=public
          TEST_DATABASE_URL: postgresql://cloudquiz:cloudquiz_test_secret@localhost:5434/cloudquiz_test?schema=public
          JWT_SECRET: ci-jwt-test-secret-at-least-32-characters-long
          CSRF_SECRET: ci-csrf-test-secret-at-least-16-characters-long
          COOKIE_SECRET: ci-cookie-test-secret-at-least-16-characters-long
        run: npm run test:backend

      - name: Execute frontend tests
        run: npm run test:frontend

      - name: Build backend application
        run: npm run build:backend

      - name: Build frontend application
        run: npm run build:frontend
